server {
    listen 80;
    server_name localhost;
    
    # 限制上传文件大小
    client_max_body_size 20m;

    # WebDAV 反向代理到飞牛 fnOS WebDAV 服务（容器通过 host.docker.internal 访问宿主机 5005）
    # 解决浏览器直连 fnOS WebDAV 的 CORS 与混合内容限制

    # 处理不带尾斜杠的 /dav 请求（连接测试 PROPFIND 常发到此路径）
    # 308 保持方法不变，浏览器会跟随重定向到 /dav/
    # absolute_redirect off 生成相对路径 Location，避免端口丢失导致重定向到错误地址
    location = /dav {
        absolute_redirect off;
        return 308 /dav/;
    }

    location /dav/ {
        # 视频文件可能较大，不限制请求体；关闭缓冲以支持大文件直传
        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;

        # CORS 头（WebDAV 方法需包含 PROPFIND / MOVE / MKCOL / DELETE）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, PUT, DELETE, OPTIONS, PROPFIND, MKCOL, MOVE, COPY' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Depth,Destination,Overwrite' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # 处理预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, PUT, DELETE, OPTIONS, PROPFIND, MKCOL, MOVE, COPY';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Depth,Destination,Overwrite';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # WebDAV MOVE/COPY 的 Destination 头携带对外地址，需重写为上游地址
        set $dav_destination $http_destination;
        if ($dav_destination ~* "^https?://[^/]+/dav(?<dav_dest_path>/.*)$") {
            set $dav_destination "http://host.docker.internal:5005${dav_dest_path}";
        }

        # 去掉 /dav 前缀后转发到 fnOS WebDAV
        rewrite ^/dav/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Destination $dav_destination;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 支持 SPA 前端路由
        try_files $uri $uri/ /index.html;
    }

    # 内部 Proxy 解决跨域问题
    location /proxy/ {
        # 必须配置 DNS 解析器才能动态解析 URL
        resolver 8.8.8.8 8.8.4.4 ipv6=off valid=300s;
        
        # 检查是否传递了 url 参数
        if ($arg_url = "") {
            return 400 "Missing url parameter";
        }

        # SSRF 防护逻辑：验证 URL
        set $is_valid_url 0;
        
        # 规则 1: 检查图片/视频后缀
        if ($arg_url ~* \.(png|jpe?g|gif|webp|svg|bmp|avif|mp4)(\?.*)?$) {
            set $is_valid_url 1;
        }
        
        # 规则 2: 检查白名单域名
        if ($arg_url ~* ^https?://([^/]+\.)?(openai\.com|googleusercontent\.com|googleapis\.com|a4f\.co|muse-ai\.oss-cn-hangzhou\.aliyuncs\.com|gitee-ai\.su\.bcebos\.com|hf\.space)/) {
            set $is_valid_url 1;
        }
        
        # 拦截不合规的请求
        if ($is_valid_url = 0) {
            return 403 "Forbidden: URL must be an image/video or from a whitelisted domain";
        }

        # 限制代理最大临时文件大小（20MB）防止大文件撑爆磁盘
        proxy_max_temp_file_size 20m;

        # 启用代理时的 SNI 支持
        proxy_ssl_server_name on;

        # 添加跨域 Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # 处理预检请求 (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 转发代理请求
        proxy_pass $arg_url;
    }
}
